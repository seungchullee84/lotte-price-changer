<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>롯데백화점 가격 변경기</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="page-header">
    <h1>가격 변경기</h1>
    <button id="open-portal" type="button" class="button button-outline" disabled>포털 열기</button>
  </header>

  <main>
    <section class="list-management" aria-labelledby="import-heading">
      <details id="import-details" open>
        <summary>
          <span id="import-heading">목록 관리</span>
          <span id="plan-summary" class="muted"></span>
        </summary>
        <form id="import-form" class="import-form">
          <div class="import-tools">
            <label for="source-text">품번 · 원가격 · 할인 판매가</label>
            <div class="file-picker">
              <input id="memo-file" type="file" accept=".txt,.xlsx,text/plain,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet">
              <label for="memo-file" class="button button-outline">TXT·엑셀 열기</label>
            </div>
          </div>
          <textarea id="source-text" rows="5" spellcheck="false"
            placeholder="01001234    49,800    44,200" aria-describedby="import-hint"></textarea>
          <div class="import-tools">
            <p id="import-hint" class="muted">엑셀 첫 시트의 A~C열을 사용합니다.</p>
            <div class="import-actions">
              <button id="discard-draft" class="button button-outline" type="button" hidden>편집 취소</button>
              <button id="save-plan" class="button button-primary" type="submit" disabled>목록 저장</button>
            </div>
          </div>
        </form>
        <div id="history-tools" class="history-tools" hidden>
          <label for="history-select">보관 목록</label>
          <select id="history-select" disabled></select>
          <button id="load-history" class="button button-outline" type="button" disabled>불러오기</button>
          <a id="download-history" class="button button-outline" download hidden>TXT 받기</a>
        </div>
      </details>
      <details id="import-errors" class="import-errors" hidden>
        <summary id="import-error-title">확인이 필요한 행</summary>
        <ul id="import-error-list"></ul>
      </details>
    </section>

    <section aria-labelledby="work-heading">
      <h2 id="work-heading" class="sr-only">가격 목록</h2>
      <div class="work-controls">
        <fieldset id="mode-controls">
          <legend class="sr-only">작업 모드</legend>
          <div class="segmented">
            <label><input type="radio" name="mode" value="discount" checked disabled><span>할인 적용</span></label>
            <label><input type="radio" name="mode" value="restore" disabled><span>원가격 복구</span></label>
          </div>
        </fieldset>
        <fieldset id="schedule-controls">
          <legend class="sr-only">적용 시작 (한국 시간)</legend>
          <div class="date-controls">
            <span class="schedule-label" aria-hidden="true">적용 시작 <small>한국 시간</small></span>
            <label class="sr-only" for="schedule-date">적용 날짜</label>
            <input id="schedule-date" type="date" required disabled>
            <label class="sr-only" for="schedule-hour">적용 시각</label>
            <select id="schedule-hour" required disabled></select>
          </div>
        </fieldset>
        <div class="work-actions">
          <button id="check-prices" class="button button-primary" type="button" disabled>현재가 조회</button>
          <button id="run-prices" class="button button-outline" type="button" title="선택한 시각에 정상마진 34로 포털에 저장합니다." disabled>변경 대상만 적용</button>
          <button id="check-and-run-prices" class="button button-quiet" type="button" title="현재가 조회 후 정상마진 34로 포털에 저장합니다." disabled>조회 후 바로 적용</button>
        </div>
      </div>
      <div class="notices">
        <p id="status-message" class="notice" role="status">저장된 목록을 확인하고 있습니다.</p>
        <p id="error-message" class="notice notice-error" role="alert" hidden></p>
        <p id="startup-warnings" class="notice notice-warning" role="status" hidden></p>
      </div>

      <div id="empty-state" class="empty-state" hidden>목록 관리에서 TXT·엑셀을 열거나 가격 목록을 붙여넣으세요.</div>
      <div id="list-view" hidden>
        <div id="result-groups" class="result-groups" role="group" aria-label="조회 결과 분류"></div>
        <div class="list-tools">
          <label for="code-filter" class="sr-only">품번 또는 상품명 검색</label>
          <input id="code-filter" type="search" placeholder="품번 · 상품명 검색">
          <label for="result-filter" class="sr-only">상태별로 보기</label>
          <select id="result-filter">
            <option value="">모든 상태</option>
            <option value="ready">변경 대상</option>
            <option value="missing">상품 없음</option>
            <option value="price_condition">가격 조건 불일치</option>
            <option value="completed">적용 완료·진행 중</option>
            <option value="additional">추가 확인</option>
            <option value="already">목표가 일치</option>
            <option value="pending_change">변경 진행·예정</option>
            <option value="saved">저장 확인</option>
            <option value="review">확인 필요</option>
            <option value="unchecked">조회 전</option>
          </select>
          <span id="work-count" class="muted" aria-live="polite"></span>
        </div>
        <div class="table-scroll" tabindex="0" role="region" aria-label="가격 변경 목록">
          <table>
            <colgroup>
              <col>
              <col span="3" class="price-column">
              <col class="status-column">
              <col class="action-column">
            </colgroup>
            <thead>
              <tr>
                <th scope="col">품번 · 상품명</th>
                <th scope="col" class="money">원가격</th>
                <th scope="col" class="money">할인 판매가</th>
                <th scope="col" class="money">포털 현재가</th>
                <th scope="col">상태</th>
                <th scope="col" class="action-cell">작업</th>
              </tr>
            </thead>
            <tbody id="price-rows"></tbody>
          </table>
        </div>
        <p id="no-filter-results" class="empty-state" hidden>검색 조건에 맞는 상품이 없습니다.</p>
      </div>
    </section>
  </main>

  <dialog id="price-edit-dialog" aria-labelledby="price-edit-heading">
    <form id="price-edit-form" novalidate>
      <h2 id="price-edit-heading">할인 판매가 수정</h2>
      <p id="price-edit-product" class="muted"></p>
      <label for="price-edit-value">할인 판매가</label>
      <div class="price-edit-amount">
        <input id="price-edit-value" type="text" inputmode="numeric" autocomplete="off" required
          aria-describedby="price-edit-hint price-edit-message">
        <span>원</span>
      </div>
      <p id="price-edit-hint" class="muted"></p>
      <p class="muted price-edit-note">목록에 저장됩니다. 적용하려면 현재가를 다시 조회하세요.</p>
      <p id="price-edit-message" role="alert"></p>
      <div class="price-edit-actions">
        <button id="price-edit-cancel" class="button button-outline" type="button">취소</button>
        <button id="price-edit-save" class="button button-primary" type="submit">확인</button>
      </div>
    </form>
  </dialog>
</body>
</html>
